name: Build and deploy site

on:
  push:
    branches: [main]
    paths: ["*.zip", "*.apk", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip the site
        run: |
          set -euo pipefail
          zip=$(ls *.zip | head -n1)
          rm -rf _tmp _site && mkdir _tmp
          unzip -q "$zip" -d _tmp
          # if the zip holds a single top-level folder, use that as the site root
          if [ "$(ls -A _tmp | wc -l)" -eq 1 ] && [ -d "_tmp/$(ls _tmp)" ]; then
            mv "_tmp/$(ls _tmp)" _site
          else
            mv _tmp _site
          fi

      - name: Add the APK and write apk.json
        run: |
          set -euo pipefail
          # newest Yantra-*.apk from the repo root, else from inside the zip
          apk=$(ls Yantra-*.apk _site/Yantra-*.apk 2>/dev/null | sort -V | tail -n1)
          [ -n "$apk" ] || { echo "No Yantra-*.apk found"; exit 1; }
          name=$(basename "$apk")
          [ "$apk" = "_site/$name" ] || cp "$apk" "_site/$name"
          ver=${name#Yantra-}; ver=${ver%.apk}
          jq -n \
            --arg file "$name" \
            --arg version "$ver" \
            --argjson size "$(stat -c%s "_site/$name")" \
            --arg sha256 "$(sha256sum "_site/$name" | cut -d' ' -f1)" \
            --arg updated "$(date -u +%F)" \
            --arg repo "https://github.com/${{ github.repository }}" \
            --arg issues "https://github.com/${{ github.repository }}/issues" \
            '{file:$file,version:$version,size:$size,sha256:$sha256,updated:$updated,repo:$repo,issues:$issues}' > _site/apk.json
          cat _site/apk.json
          touch _site/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
