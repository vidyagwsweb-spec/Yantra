name: Build and deploy site

on:
  push:
    branches: [main]
    paths: ["*.zip", "*.apk", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip the site
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          zips=( *.zip )
          if [ ${#zips[@]} -eq 0 ]; then
            echo "::error::No .zip file in the repo root"
            exit 1
          fi
          # newest zip by modification time, if there is more than one
          zip=$(ls -1t -- "${zips[@]}" | head -n1)
          echo "Using $zip"
          rm -rf _tmp _site && mkdir _tmp
          unzip -q "$zip" -d _tmp
          # if the zip holds a single top-level folder, use that as the site root
          shopt -s dotglob
          entries=( _tmp/* )
          shopt -u dotglob
          if [ ${#entries[@]} -eq 1 ] && [ -d "${entries[0]}" ]; then
            mv "${entries[0]}" _site
          else
            mv _tmp _site
          fi

      - name: Add the APK and write apk.json
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          # newest Yantra-*.apk from the repo root, else from inside the zip
          apks=( Yantra-*.apk _site/Yantra-*.apk )
          if [ ${#apks[@]} -eq 0 ]; then
            echo "::error::No Yantra-*.apk found in the repo root or in _site"
            exit 1
          fi
          # sort by the version in the file name, so a root copy and a copy
          # inside the zip are compared on version and not on their path
          apk=$(for f in "${apks[@]}"; do
                  b=$(basename "$f"); v=${b#Yantra-}; v=${v%.apk}
                  printf '%s\t%s\n' "$v" "$f"
                done | sort -V -k1,1 | tail -n1 | cut -f2-)
          name=$(basename "$apk")
          echo "Using $apk"
          [ "$apk" = "_site/$name" ] || cp "$apk" "_site/$name"
          ver=${name#Yantra-}; ver=${ver%.apk}
          jq -n \
            --arg file "$name" \
            --arg version "$ver" \
            --argjson size "$(stat -c%s "_site/$name")" \
            --arg sha256 "$(sha256sum "_site/$name" | cut -d' ' -f1)" \
            --arg updated "$(date -u +%F)" \
            --arg repo "https://github.com/${{ github.repository }}" \
            --arg issues "https://github.com/${{ github.repository }}/issues" \
            '{file:$file,version:$version,size:$size,sha256:$sha256,updated:$updated,repo:$repo,issues:$issues}' > _site/apk.json
          cat _site/apk.json
          touch _site/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
